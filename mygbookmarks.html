<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus · Bookmarks</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --ink: #0d0d14;
  --ink2: #1a1a2e;
  --surface: #111122;
  --panel: #16162a;
  --card: #1e1e38;
  --card2: #252545;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --accent: #7c6cfc;
  --accent2: #a78bfa;
  --accent3: #38bdf8;
  --gold: #fbbf24;
  --rose: #f472b6;
  --green: #34d399;
  --text: #e8e8f5;
  --muted: #7878a0;
  --muted2: #5a5a80;
  --glow: rgba(124, 108, 252, 0.25);
  --glow2: rgba(56, 189, 248, 0.15);
  font-family: 'DM Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--ink); color: var(--text); }

/* ─── SCROLLBARS ─── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

/* ─── LAYOUT ─── */
.app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; gap: 0; }

/* ─── SIDEBAR ─── */
.sidebar {
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 0;
  overflow: hidden;
  position: relative;
}
.sidebar::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at top left, rgba(124,108,252,0.12) 0%, transparent 60%);
  pointer-events: none;
}

.sidebar-top {
  padding: 20px 16px 16px;
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 14px;
}
.logo-wrap {
  width: 42px; height: 42px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent3));
  display: flex; align-items: center; justify-content: center;
  font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; color: #fff;
  box-shadow: 0 0 20px var(--glow);
  overflow: hidden; flex-shrink: 0;
}
.logo-wrap img { width: 100%; height: 100%; border-radius: 12px; object-fit: cover; }
.brand-text h1 {
  font-family: 'Syne', sans-serif; font-weight: 800; font-size: 16px; color: var(--text); letter-spacing: -0.3px;
}
.brand-text .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

#loginBtn {
  width: 100%;
  padding: 9px 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent3));
  border: none; border-radius: 10px; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13px; color: #fff;
  transition: all .2s; box-shadow: 0 4px 16px var(--glow);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
#loginBtn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px var(--glow); }

.user-chip {
  display: none; align-items: center; gap: 10px;
  background: var(--card); border-radius: 10px; padding: 8px 10px;
  border: 1px solid var(--border2);
}
.user-chip.visible { display: flex; }
.user-chip .info { flex: 1; min-width: 0; }
.user-chip .info .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-chip .info .email { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sign-out-btn {
  background: rgba(255,255,255,0.06); border: none; border-radius: 6px; padding: 4px 8px;
  font-size: 10px; color: var(--muted); cursor: pointer; white-space: nowrap; transition: all .2s;
}
.sign-out-btn:hover { background: rgba(255,80,80,0.2); color: #ff6b6b; }

/* ─── NAV BUTTONS ─── */
.sidebar-nav { padding: 12px 10px 0; display: flex; flex-direction: column; gap: 4px; }
.nav-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 10px;
  background: none; border: none; cursor: pointer; color: var(--muted);
  font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 13px;
  transition: all .2s; text-align: left; width: 100%;
}
.nav-btn svg { width: 17px; height: 17px; flex-shrink: 0; }
.nav-btn:hover { background: var(--card); color: var(--text); }
.nav-btn.active { background: linear-gradient(135deg, rgba(124,108,252,0.2), rgba(56,189,248,0.1)); color: var(--accent2); }
#addCategoryBtn, #settingsBtn { display: none; }

/* ─── CATEGORIES ─── */
.cat-section-header {
  padding: 14px 16px 6px;
  font-size: 10px; font-weight: 600; color: var(--muted2); letter-spacing: 1.5px; text-transform: uppercase;
}
.categories { flex: 1; overflow-y: auto; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 2px; }
.category {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 10px;
  cursor: pointer; transition: all .2s; position: relative;
  border: 1px solid transparent;
}
.category:hover { background: var(--card); border-color: var(--border2); }
.category.active { background: linear-gradient(135deg, rgba(124,108,252,0.15), rgba(56,189,248,0.08)); border-color: rgba(124,108,252,0.3); }
.cat-icon {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent3));
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
  font-family: 'Syne', sans-serif;
}
.cat-name { flex: 1; font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-count { font-size: 10px; color: var(--muted2); background: var(--card2); padding: 2px 6px; border-radius: 10px; }
.cat-actions { display: none; gap: 2px; }
.category:hover .cat-actions { display: flex; }
.cat-action-btn {
  width: 24px; height: 24px; border-radius: 6px; background: rgba(255,255,255,0.06);
  border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 11px; transition: all .2s;
}
.cat-action-btn:hover { background: rgba(255,255,255,0.12); }

/* ─── RADIO ─── */
.radio-section {
  margin: 8px 10px 10px;
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 14px; padding: 12px 14px;
  flex-shrink: 0;
}
.radio-screen {
  background: #000; color: #00ff9d; border-radius: 8px;
  padding: 8px 10px; margin-bottom: 10px;
  font-family: 'Courier New', monospace; font-size: 12px;
  min-height: 48px; display: flex; flex-direction: column; justify-content: center;
  box-shadow: inset 0 0 10px rgba(0,255,100,0.1);
  text-shadow: 0 0 8px rgba(0,255,100,0.6);
}
.station-name { font-weight: 700; font-size: 13px; }
.station-freq { font-size: 10px; opacity: 0.7; }
.radio-controls { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 8px; }
.radio-btn {
  background: var(--card2); border: none; border-radius: 50%; width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text); font-size: 14px; cursor: pointer; transition: all .2s;
}
.radio-btn:hover { background: var(--accent); transform: scale(1.05); }
#playPauseBtn { width: 44px; height: 44px; background: linear-gradient(135deg, var(--green), #059669); font-size: 16px; box-shadow: 0 4px 12px rgba(52,211,153,0.3); }
#playPauseBtn:hover { box-shadow: 0 6px 20px rgba(52,211,153,0.5); }
.vol-controls { display: flex; align-items: center; justify-content: center; gap: 8px; }
.vol-btn { background: var(--card2); border: none; border-radius: 6px; padding: 4px 10px; color: var(--text); cursor: pointer; font-size: 14px; transition: all .2s; }
.vol-btn:hover { background: var(--accent); }
#volumeDisplay { font-size: 12px; font-weight: 600; color: var(--accent2); min-width: 36px; text-align: center; }

/* ─── MAIN ─── */
.main {
  display: flex; flex-direction: column; height: 100vh;
  background: var(--ink); overflow: hidden;
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 28px; border-bottom: 1px solid var(--border);
  background: var(--ink); flex-shrink: 0; gap: 16px;
}
.topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.page-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent3));
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: #fff; flex-shrink: 0;
  font-family: 'Syne', sans-serif;
}
#pageTitle { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; color: var(--text); }

.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.search-wrap {
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border: 1px solid var(--border2); border-radius: 10px;
  padding: 7px 12px; transition: all .2s;
}
.search-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--glow); }
.search-wrap svg { color: var(--muted); width: 15px; height: 15px; flex-shrink: 0; }
#searchInput {
  background: none; border: none; outline: none;
  font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text);
  width: 180px;
}
#searchInput::placeholder { color: var(--muted2); }

.tb-btn {
  background: var(--card); border: 1px solid var(--border2); border-radius: 10px;
  padding: 7px 14px; cursor: pointer; color: var(--text);
  font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 13px;
  display: flex; align-items: center; gap: 6px; transition: all .2s; white-space: nowrap;
}
.tb-btn:hover { background: var(--card2); border-color: var(--accent); }
.tb-btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent3));
  border-color: transparent; color: #fff;
  box-shadow: 0 4px 12px var(--glow);
}
.tb-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--glow); }
.tb-btn svg { width: 15px; height: 15px; }

/* ─── CONTENT ─── */
.content-scroll { flex: 1; overflow-y: auto; padding: 24px 28px; }

/* ─── HOME GRID ─── */
.section-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
}
.section-label {
  font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; color: var(--text);
}
.section-line { flex: 1; height: 1px; background: var(--border); }

.bookmark-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 14px;
}

.bookmark-tile {
  position: relative;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px 12px 14px;
  text-align: center;
  cursor: pointer;
  transition: all .25s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-decoration: none;
  color: var(--text);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  overflow: hidden;
}
.bookmark-tile::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(124,108,252,0.0), rgba(56,189,248,0.0));
  transition: all .25s;
}
.bookmark-tile:hover {
  transform: translateY(-4px) scale(1.02);
  border-color: var(--border2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.3), 0 0 0 1px rgba(124,108,252,0.3);
}
.bookmark-tile:hover::before {
  background: linear-gradient(135deg, rgba(124,108,252,0.08), rgba(56,189,248,0.05));
}
.tile-icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800; color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent3));
  flex-shrink: 0;
  overflow: hidden;
}
.tile-icon img { width: 100%; height: 100%; border-radius: 12px; object-fit: contain; }
.tile-title {
  font-size: 12px; font-weight: 500; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  width: 100%;
}
.tile-edit-btn {
  position: absolute; top: 7px; right: 7px;
  display: none; width: 24px; height: 24px; border-radius: 6px;
  background: var(--card2); border: 1px solid var(--border2);
  align-items: center; justify-content: center;
  cursor: pointer; font-size: 11px; z-index: 5;
  transition: all .2s;
}
.tile-edit-btn:hover { background: var(--accent); border-color: var(--accent); }
.bookmark-tile:hover .tile-edit-btn { display: flex; }

/* ─── WEATHER ─── */
.weather-card {
  background: var(--card); border: 1px solid var(--border2);
  border-radius: 20px; overflow: hidden;
  display: flex; margin-bottom: 24px;
}
.weather-left {
  background: linear-gradient(135deg, #1a0533, #0d1a3a);
  padding: 20px 18px; flex: 0 0 190px;
  display: flex; flex-direction: column; gap: 12px;
  position: relative; overflow: hidden;
}
.weather-left::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 30% 40%, rgba(124,108,252,0.3), transparent 70%);
}
.weather-animation { position: absolute; inset: 0; pointer-events: none; }
.rain-drop { position: absolute; width: 1px; height: 16px; background: linear-gradient(transparent, rgba(147,197,253,0.5)); animation: rain linear infinite; }
@keyframes rain { to { transform: translateY(230px); opacity: 0; } }
.snow-flake { position: absolute; width: 5px; height: 5px; background: rgba(255,255,255,0.8); border-radius: 50%; animation: snow linear infinite; }
@keyframes snow { to { transform: translateY(230px) rotate(360deg); opacity: 0; } }

.district-selector { position: relative; z-index: 10; }
.district-selector select {
  width: 100%; padding: 5px 10px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
  font-size: 11px; background: rgba(255,255,255,0.08); color: #fff; cursor: pointer;
  outline: none; font-family: 'DM Sans', sans-serif;
}
.district-selector select option { background: #1a0533; }
.current-weather { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; }
.w-icon { font-size: 40px; margin-bottom: 4px; }
.w-temp { font-family: 'Syne', sans-serif; font-size: 44px; font-weight: 800; line-height: 1; color: #fff; }
.w-desc { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 4px; text-align: center; }
.w-details { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; position: relative; z-index: 10; }
.w-detail { display: flex; align-items: center; gap: 4px; font-size: 10px; color: rgba(255,255,255,0.8); }
.weather-right { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.w-section-title { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; }
.hourly-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.hour-card {
  min-width: 56px; background: var(--card2); border-radius: 10px; padding: 8px 6px;
  text-align: center; border: 1px solid var(--border); flex-shrink: 0; transition: all .2s;
}
.hour-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.hour-time { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
.hour-icon { font-size: 18px; margin: 2px 0; }
.hour-temp { font-size: 13px; font-weight: 600; }
.hour-rain { font-size: 9px; color: var(--accent3); margin-top: 2px; }
.daily-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.day-card {
  min-width: 70px; background: var(--card2); border-radius: 10px; padding: 10px 8px;
  text-align: center; border: 1px solid var(--border); flex-shrink: 0; transition: all .2s;
}
.day-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.day-name { font-size: 11px; font-weight: 600; color: var(--accent2); margin-bottom: 4px; }
.day-icon { font-size: 22px; margin: 4px 0; }
.day-temps { display: flex; justify-content: center; gap: 6px; font-size: 12px; }
.day-max { font-weight: 600; }
.day-min { color: var(--muted); }
.day-rain { font-size: 9px; color: var(--accent3); margin-top: 3px; }

/* ─── GAMES ─── */
.games-section { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-top: 8px; }
.games-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.games-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; }
.games-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.game-tab {
  padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
  cursor: pointer; background: var(--card2); color: var(--muted); border: 1px solid var(--border);
  transition: all .2s; font-family: 'DM Sans', sans-serif;
}
.game-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
.game-card {
  position: relative; border-radius: 12px; overflow: hidden;
  aspect-ratio: 2/3; background: var(--card2); background-size: cover; background-position: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3); transition: all .25s; cursor: pointer;
  border: 1px solid var(--border);
}
.game-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-color: var(--border2); }
.game-card-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 35%, rgba(0,0,0,0.85) 100%);
  display: flex; flex-direction: column; justify-content: space-between; padding: 10px;
}
.game-card-title { color: #fff; font-weight: 700; font-size: 12px; line-height: 1.3; }
.game-card-percent {
  align-self: flex-end; padding: 3px 7px; border-radius: 6px;
  font-size: 10px; font-weight: 800;
  background: rgba(124,108,252,0.9); color: #fff;
}
.game-card-percent.done { background: rgba(52,211,153,0.9); }
.game-edit-btn {
  position: absolute; top: 7px; right: 7px; width: 26px; height: 26px; border-radius: 6px;
  background: rgba(0,0,0,0.7); border: none; cursor: pointer; color: #fff;
  display: none; align-items: center; justify-content: center; font-size: 12px; z-index: 10;
}
.game-card:hover .game-edit-btn { display: flex; }

/* ─── EMPTY STATE ─── */
.empty-state {
  text-align: center; padding: 60px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.empty-state .icon { font-size: 48px; opacity: 0.5; }
.empty-state .title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; color: var(--muted); }
.empty-state .sub { font-size: 13px; color: var(--muted2); }

/* ─── MODAL ─── */
.modal {
  position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 1000;
}
.modal.active { display: flex; animation: fadeIn .15s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-card {
  background: var(--panel); border: 1px solid var(--border2);
  border-radius: 20px; padding: 24px; width: 420px; max-width: 95vw;
  box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  animation: slideUp .2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes slideUp { from { transform: translateY(12px) scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-title {
  font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px;
  color: var(--text); margin-bottom: 18px;
}
.form-group { margin-bottom: 14px; }
.form-group label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 10px 12px;
  background: var(--card); border: 1px solid var(--border2); border-radius: 10px;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px;
  outline: none; transition: all .2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow);
}
.form-group select option { background: var(--panel); }
.form-group textarea { height: 80px; resize: none; }
.switch-row { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
.switch-row label { font-size: 13px; color: var(--text); cursor: pointer; }
.switch-row input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.btn {
  padding: 9px 18px; border-radius: 10px; border: none; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13px;
  transition: all .2s; display: inline-flex; align-items: center; gap: 6px;
}
.btn-ghost { background: var(--card); color: var(--muted); border: 1px solid var(--border2); }
.btn-ghost:hover { background: var(--card2); color: var(--text); }
.btn-primary { background: linear-gradient(135deg, var(--accent), #6366f1); color: #fff; box-shadow: 0 4px 12px var(--glow); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--glow); }
.btn-danger { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
.btn-danger:hover { background: rgba(239,68,68,0.25); }

/* ─── SAVE INDICATOR ─── */
#saveIndicator {
  position: fixed; bottom: 20px; right: 20px;
  background: var(--card); border: 1px solid var(--border2); border-radius: 12px;
  padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--green);
  display: none; z-index: 999; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  align-items: center; gap: 8px;
}
#saveIndicator.show { display: flex; animation: slideUp .2s ease; }

/* ─── SETTINGS ─── */
.settings-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.settings-row p { font-size: 12px; color: var(--muted); line-height: 1.5; }
#importArea { margin-top: 10px; }

/* ─── CATEGORY EMPTY ─── */
.cat-toolbar { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 16px; }

/* ─── ANIMATIONS ─── */
.bookmark-tile { animation: tileIn .25s ease both; }
@keyframes tileIn { from { opacity: 0; transform: scale(0.92) translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<script>
// ─────────────────────────────────────────
// AYARLAR
// ─────────────────────────────────────────
const CLIENT_ID  = '327262743308-1vfejjse1emujd4ocotrjtii799pgho8.apps.googleusercontent.com';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwVZ1iKbIEsxHim854VO7SPck8yqhaK458K1ynC3JOv2L1RUvB3YbEmV9MLnI70Nv5-xw/exec';
const LS_KEY     = 'nexus_bookmarks_v2';
const LS_GAMES   = 'nexus_games_v2';
// ─────────────────────────────────────────

const $ = s => document.querySelector(s);
let BOOKMARKS = [];
let GAMES = [];
let currentUser = null;
let accessToken = null;
let currentView = 'home';
let editingState = { bookmarkId: null, categoryId: null };
let editingGameId = null;
let activeGameTab = 'playing';
let tokenClient = null;
let searchQuery = '';

// ─── LOCAL STORAGE (Ana kalıcılık mekanizması) ───
function saveLocal() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(BOOKMARKS));
    localStorage.setItem(LS_GAMES, JSON.stringify(GAMES));
  } catch(e) { console.warn('LocalStorage yazma hatası:', e); }
}

function loadLocal() {
  try {
    const b = localStorage.getItem(LS_KEY);
    const g = localStorage.getItem(LS_GAMES);
    if (b) BOOKMARKS = JSON.parse(b);
    if (g) GAMES = JSON.parse(g);
    BOOKMARKS.forEach((cat, i) => {
      if (cat.order === undefined) cat.order = i;
      cat.items = (cat.items || []).map(item => ({...item, showHome: !!item.showHome}));
    });
  } catch(e) { BOOKMARKS = []; GAMES = []; }
}

// ─── SHEETS API (Yedek senkronizasyon) ───
async function loadFromSheets() {
  try {
    const url = SCRIPT_URL + '?action=read&token=' + encodeURIComponent(accessToken);
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    // Sheets'teki veri localStorage'dakinden fazlaysa uygula
    if (data.categories && data.categories.length > 0) {
      BOOKMARKS = data.categories;
      GAMES = data.games || [];
      BOOKMARKS.forEach((cat, i) => {
        if (cat.order === undefined) cat.order = i;
        cat.items = (cat.items || []).map(item => ({...item, showHome: !!item.showHome}));
      });
      saveLocal(); // Sheets'ten geleni anında yerel kaydet
    }
  } catch(e) {
    console.warn('Sheets yüklenemedi, yerel veri kullanılıyor:', e);
    // Yerel veri zaten yüklü, sorun değil
  }
}

async function saveToSheets() {
  if (!accessToken) return;
  try {
    const body = JSON.stringify({ token: accessToken, action: 'write', categories: BOOKMARKS, games: GAMES });
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // CORS hatalarını önlemek için
      headers: { 'Content-Type': 'text/plain' },
      body
    });
  } catch(e) { console.warn('Sheets kayıt hatası (yerel kaydedildi):', e); }
}

async function handleDataChange() {
  saveLocal(); // Önce anında yerel kaydet
  showSaveIndicator();
  renderApp();
  saveToSheets(); // Arka planda Sheets'e de gönder (başarısız olsa da yerel kayıt güvende)
}

function showSaveIndicator() {
  $('#saveIndicator').classList.add('show');
  setTimeout(() => $('#saveIndicator').classList.remove('show'), 2000);
}

// ─── GOOGLE OAUTH ───
window.onload = () => {
  loadLocal(); // Her zaman önce yerel yükle
  renderApp();
  if (typeof google === 'undefined') {
    setTimeout(initGoogle, 500);
  } else {
    initGoogle();
  }
};

function initGoogle() {
  if (typeof google === 'undefined') return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile',
    callback: handleTokenResponse,
  });
}

async function handleTokenResponse(resp) {
  if (resp.error) { console.error(resp); return; }
  accessToken = resp.access_token;
  const info = await fetch("https://www.googleapis.com/oauth2/v3/userinfo?access_token=" + accessToken).then(r => r.json());
  currentUser = info;
  showLoggedIn(info);
  await loadFromSheets();
  renderApp();
}

function showLoggedIn(info) {
  $('#userChip').classList.add('visible');
  $('#chipName').textContent = info.name || 'Kullanıcı';
  $('#chipEmail').textContent = info.email || '';
  $('#loginBtn').style.display = 'none';
  $('#userLogo').innerHTML = info.picture ? `<img src="${info.picture}" alt="">` : (info.name || 'N').charAt(0);
  $('#addCategoryBtn').style.display = 'flex';
  $('#settingsBtn').style.display = 'flex';
  $('#catSectionHeader').style.display = 'block';
}

function signOut() {
  if (accessToken && typeof google !== 'undefined') {
    try { google.accounts.oauth2.revoke(accessToken, () => {}); } catch(e) {}
  }
  accessToken = null;
  currentUser = null;
  $('#userChip').classList.remove('visible');
  $('#loginBtn').style.display = 'flex';
  $('#addCategoryBtn').style.display = 'none';
  $('#settingsBtn').style.display = 'none';
  $('#catSectionHeader').style.display = 'none';
  $('#userLogo').textContent = 'N';
  // Verileri silme — yerel kalıcı kalsın
}

// ─── RENDER ───
function sortCategories() { BOOKMARKS.sort((a, b) => (a.order ?? 999) - (b.order ?? 999)); }

function renderApp() {
  sortCategories();
  renderCategories();
  if (currentView === 'home') renderHome();
  else renderCategory(currentView);
}

function createFaviconHTML(item) {
  if (item.icon) {
    return `<img src="${item.icon}" alt="" onerror="this.parentElement.innerHTML='${escapeHtml(item.title.charAt(0).toUpperCase())}'">`;
  }
  let hostname = '';
  try { hostname = new URL(item.url).hostname; } catch(e) {}
  if (hostname) {
    const pri = `https://www.google.com/s2/favicons?domain=${hostname}&sz=64`;
    const fb  = `https://t1.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=http://${hostname}&size=64`;
    return `<img src="${pri}" alt="" onerror="this.onerror=null;this.src='${fb}'">`;
  }
  return item.title.charAt(0).toUpperCase();
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderCategories() {
  const el = $('#categories');
  el.innerHTML = '';
  BOOKMARKS.forEach(cat => {
    const div = document.createElement('div');
    div.className = 'category' + (cat.id === currentView ? ' active' : '');
    div.dataset.id = cat.id;
    const count = (cat.items || []).length;
    div.innerHTML = `
      <div class="cat-icon">${escapeHtml(cat.title.charAt(0).toUpperCase())}</div>
      <div class="cat-name">${escapeHtml(cat.title)}</div>
      <span class="cat-count">${count}</span>
      <div class="cat-actions">
        <button class="cat-action-btn edit-cat" title="Düzenle">✏️</button>
        <button class="cat-action-btn delete-cat" title="Sil">🗑️</button>
      </div>`;
    el.appendChild(div);
  });
}

function getFilteredItems(items) {
  if (!searchQuery) return items;
  const q = searchQuery.toLowerCase();
  return items.filter(i => i.title.toLowerCase().includes(q) || (i.url||'').toLowerCase().includes(q));
}

function makeTileHTML(item, categoryId) {
  const tile = document.createElement('a');
  tile.className = 'bookmark-tile';
  tile.href = item.url;
  tile.target = '_blank';
  tile.rel = 'noopener';
  tile.style.animationDelay = `${Math.random() * 0.15}s`;
  tile.innerHTML = `
    <div class="tile-icon">${createFaviconHTML(item)}</div>
    <div class="tile-title">${escapeHtml(item.title)}</div>
    <button class="tile-edit-btn" data-bookmark-id="${item.id}" data-category-id="${categoryId}">✏️</button>`;
  return tile;
}

function renderHome() {
  $('#pageTitle').textContent = 'Ana Sayfa';
  $('#pageIcon').textContent = '🏠';
  $('#addBookmarkBtn').style.display = 'none';
  const area = $('#contentArea');
  area.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;gap:28px;';

  // Favoriler
  const homeItems = BOOKMARKS.flatMap(c => (c.items||[]).filter(i=>i.showHome).map(item=>({...item,categoryId:c.id})));
  const favFiltered = getFilteredItems(homeItems);

  const favSec = document.createElement('div');
  favSec.innerHTML = `<div class="section-header"><span class="section-label">⭐ Favoriler</span><div class="section-line"></div></div>`;
  const favGrid = document.createElement('div');
  favGrid.className = 'bookmark-grid';
  if (favFiltered.length === 0) {
    favGrid.innerHTML = `<div class="empty-state"><div class="icon">📌</div><div class="title">Henüz favori yok</div><div class="sub">Bookmark eklerken "Ana Sayfada Göster"i seç</div></div>`;
  } else {
    favFiltered.forEach((item, idx) => {
      const t = makeTileHTML(item, item.categoryId);
      t.style.animationDelay = `${idx * 0.04}s`;
      favGrid.appendChild(t);
    });
  }
  favSec.appendChild(favGrid);
  wrap.appendChild(favSec);

  // Hava Durumu
  const weatherDiv = document.createElement('div');
  weatherDiv.innerHTML = buildWeatherHTML();
  wrap.appendChild(weatherDiv);

  // Oyunlar
  const gameDiv = document.createElement('div');
  gameDiv.className = 'games-section';
  gameDiv.innerHTML = `
    <div class="games-header">
      <div class="games-title">🎮 Oyunlarım</div>
      <button class="btn btn-primary" id="addGameBtn" style="font-size:12px;padding:6px 12px;">+ Oyun Ekle</button>
    </div>
    <div class="games-tabs">
      <button class="game-tab ${activeGameTab==='playing'?'active':''}" data-tab="playing">Oynuyor</button>
      <button class="game-tab ${activeGameTab==='completed'?'active':''}" data-tab="completed">Bitti</button>
    </div>
    <div class="games-grid" id="gamesGrid"></div>`;
  wrap.appendChild(gameDiv);
  area.appendChild(wrap);

  setTimeout(() => { initWeatherWidget(); renderGames(); }, 50);
}

function buildWeatherHTML() {
  return `<div class="weather-card">
    <div class="weather-left" id="weatherLeft">
      <div class="weather-animation" id="weatherAnimation"></div>
      <div class="district-selector">
        <select id="districtSelect">
          <option>Etimesgut</option><option>Çankaya</option><option>Keçiören</option>
          <option>Mamak</option><option>Yenimahalle</option><option>Altındağ</option>
          <option>Sincan</option><option>Pursaklar</option><option>Gölbaşı</option>
          <option>Polatlı</option><option>Ankara Merkez</option>
        </select>
      </div>
      <div class="current-weather">
        <div class="w-icon" id="mainIcon">☁️</div>
        <div class="w-temp" id="currentTemp">--°</div>
        <div class="w-desc" id="weatherDesc">Yükleniyor...</div>
      </div>
      <div class="w-details">
        <div class="w-detail">💧 <span id="humidity">--%</span></div>
        <div class="w-detail">💨 <span id="wind">--</span></div>
        <div class="w-detail">🌧️ <span id="rainChance">--%</span></div>
        <div class="w-detail">🌡️ <span id="feelsLike">--°</span></div>
      </div>
    </div>
    <div class="weather-right">
      <div class="w-section-title">Saatlik</div>
      <div class="hourly-scroll" id="hourlyForecast"><div style="color:var(--muted);font-size:12px">Yükleniyor...</div></div>
      <div class="w-section-title" style="margin-top:8px">Günlük</div>
      <div class="daily-scroll" id="dailyForecast"><div style="color:var(--muted);font-size:12px">Yükleniyor...</div></div>
    </div>
  </div>`;
}

function renderGames() {
  const grid = $('#gamesGrid');
  if (!grid) return;
  const filtered = activeGameTab === 'playing' ? GAMES.filter(g=>g.percent<100) : GAMES.filter(g=>g.percent>=100);
  grid.innerHTML = '';
  if (filtered.length === 0) {
    grid.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:8px;">Bu listede oyun yok.</div>`;
    return;
  }
  filtered.forEach(game => {
    const card = document.createElement('div');
    card.className = 'game-card';
    if (game.image) card.style.backgroundImage = `url('${game.image}')`;
    card.innerHTML = `
      <button class="game-edit-btn" data-game-id="${game.id}">✏️</button>
      <div class="game-card-overlay">
        <div class="game-card-title">${escapeHtml(game.title)}</div>
        <div class="game-card-percent ${game.percent>=100?'done':''}">${game.percent}%</div>
      </div>`;
    grid.appendChild(card);
  });
}

function renderCategory(catId) {
  const cat = BOOKMARKS.find(c => c.id === catId);
  if (!cat) { currentView = 'home'; renderApp(); return; }
  $('#pageTitle').textContent = cat.title;
  $('#pageIcon').textContent = cat.title.charAt(0).toUpperCase();
  $('#addBookmarkBtn').style.display = 'flex';
  const area = $('#contentArea');
  area.innerHTML = '';

  const items = getFilteredItems(cat.items || []);
  const grid = document.createElement('div');
  grid.className = 'bookmark-grid';

  if (items.length === 0) {
    const msg = searchQuery
      ? `<div class="empty-state"><div class="icon">🔍</div><div class="title">Sonuç bulunamadı</div><div class="sub">"${escapeHtml(searchQuery)}" için eşleşme yok</div></div>`
      : `<div class="empty-state"><div class="icon">🔖</div><div class="title">Bu kategori boş</div><div class="sub">Sağ üstten bookmark ekle</div></div>`;
    grid.innerHTML = msg;
  } else {
    items.forEach((item, idx) => {
      const t = makeTileHTML(item, cat.id);
      t.style.animationDelay = `${idx * 0.04}s`;
      grid.appendChild(t);
    });
  }
  area.appendChild(grid);
}

// ─── MODAL HELPERS ───
function findBookmark(bookmarkId) {
  for (const cat of BOOKMARKS) {
    const bm = (cat.items||[]).find(i => i.id === bookmarkId);
    if (bm) return { bookmark: bm, category: cat };
  }
  return { bookmark: null, category: null };
}

function populateCategorySelect(selectedId = null) {
  const sel = $('#mCategory');
  sel.innerHTML = '';
  BOOKMARKS.forEach(cat => {
    sel.innerHTML += `<option value="${cat.id}" ${cat.id===selectedId?'selected':''}>${escapeHtml(cat.title)}</option>`;
  });
}

function openModalForAdd() {
  if (currentView === 'home') {
    alert('Lütfen önce bir kategori seçin.');
    return;
  }
  editingState = { bookmarkId: null, categoryId: currentView };
  $('#modalTitle').textContent = 'Bookmark Ekle';
  $('#mTitle').value = ''; $('#mUrl').value = ''; $('#mIcon').value = ''; $('#mShowHome').checked = false;
  $('#deleteBookmarkBtn').style.display = 'none';
  populateCategorySelect(currentView);
  $('#modal').classList.add('active');
}

function openModalForEdit(bookmarkId, categoryId) {
  const { bookmark } = findBookmark(bookmarkId);
  if (!bookmark) return;
  editingState = { bookmarkId, categoryId };
  $('#modalTitle').textContent = 'Bookmark Düzenle';
  $('#mTitle').value = bookmark.title;
  $('#mUrl').value = bookmark.url;
  $('#mIcon').value = bookmark.icon || '';
  $('#mShowHome').checked = !!bookmark.showHome;
  $('#deleteBookmarkBtn').style.display = 'inline-flex';
  populateCategorySelect(categoryId);
  $('#modal').classList.add('active');
}

function openCategoryEditModal(catId) {
  const cat = BOOKMARKS.find(c => c.id === catId);
  if (!cat) return;
  editingState.categoryId = catId;
  $('#ceTitle').value = cat.title;
  $('#ceOrder').value = cat.order ?? '';
  $('#modalCategoryEdit').classList.add('active');
}

function openGameModal(gameId = null) {
  editingGameId = gameId;
  if (gameId) {
    const game = GAMES.find(g => g.id === gameId);
    if (game) {
      $('#modalGameTitle').textContent = 'Oyun Düzenle';
      $('#gTitle').value = game.title;
      $('#gImage').value = game.image || '';
      $('#gPercent').value = game.percent;
      $('#deleteGameBtn').style.display = 'inline-flex';
    }
  } else {
    $('#modalGameTitle').textContent = 'Oyun Ekle';
    $('#gTitle').value = ''; $('#gImage').value = ''; $('#gPercent').value = 0;
    $('#deleteGameBtn').style.display = 'none';
  }
  $('#modalGame').classList.add('active');
}

// ─── EXPORT ───
function exportBookmarksToHtml() {
  let html = `<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>Bookmarks</TITLE>\n<H1>Bookmarks</H1>\n<DL><p>\n`;
  BOOKMARKS.forEach(cat => {
    html += `    <DT><H3>${cat.title}</H3>\n    <DL><p>\n`;
    (cat.items||[]).forEach(item => { html += `        <DT><A HREF="${item.url}">${item.title}</A>\n`; });
    html += `    </DL><p>\n`;
  });
  html += `</DL><p>\n`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], {type:'text/html'}));
  a.download = 'bookmarks_export.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ─── EVENT LISTENERS ───
$('#loginBtn').onclick = () => { if (tokenClient) tokenClient.requestAccessToken(); };
$('#miniSignOutBtn').onclick = signOut;
$('#homeBtn').onclick = () => {
  currentView = 'home';
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  $('#homeBtn').classList.add('active');
  renderApp();
};
$('#settingsBtn').onclick = () => { $('#importArea').style.display='none'; $('#modalSettings').classList.add('active'); };
$('#addCategoryBtn').onclick = () => { $('#cTitle').value=''; $('#modalCategory').classList.add('active'); };
$('#addBookmarkBtn').onclick = openModalForAdd;
$('#exportBtn').onclick = exportBookmarksToHtml;
$('#showImportBtn').onclick = () => { $('#importArea').style.display = $('#importArea').style.display==='none'?'block':'none'; };

$('#searchInput').oninput = e => {
  searchQuery = e.target.value.trim();
  renderApp();
};

$('#saveModal').onclick = async () => {
  const title = $('#mTitle').value.trim();
  let url = $('#mUrl').value.trim();
  const newCatId = $('#mCategory').value;
  if (!title || !url || !newCatId) return alert('Başlık, URL ve Kategori zorunlu.');
  if (!url.match(/^https?:\/\//i)) url = 'https://' + url;
  const bookmarkData = { title, url, icon: $('#mIcon').value.trim()||undefined, showHome: !!$('#mShowHome').checked };
  const newCat = BOOKMARKS.find(c => c.id === newCatId);
  if (!newCat) return alert('Geçersiz kategori.');
  if (editingState.bookmarkId) {
    const { bookmark, category } = findBookmark(editingState.bookmarkId);
    if (bookmark) {
      Object.assign(bookmark, bookmarkData);
      if (newCatId !== editingState.categoryId) {
        category.items = (category.items||[]).filter(i => i.id !== editingState.bookmarkId);
        newCat.items = newCat.items||[]; newCat.items.push(bookmark);
      }
    }
  } else {
    newCat.items = newCat.items||[];
    newCat.items.push({ id: 'b_'+Date.now(), ...bookmarkData });
  }
  currentView = newCatId;
  $('#modal').classList.remove('active');
  await handleDataChange();
};

$('#deleteBookmarkBtn').onclick = async () => {
  if (!editingState.bookmarkId) return;
  if (!confirm('Bu bookmark silinsin mi?')) return;
  const { category } = findBookmark(editingState.bookmarkId);
  if (category) category.items = (category.items||[]).filter(i => i.id !== editingState.bookmarkId);
  $('#modal').classList.remove('active');
  await handleDataChange();
};

$('#saveCategoryEdit').onclick = async () => {
  const title = $('#ceTitle').value.trim();
  const order = parseInt($('#ceOrder').value);
  if (!title) return alert('Kategori adı zorunlu.');
  const catId = editingState.categoryId;
  const cat = BOOKMARKS.find(c => c.id === catId);
  if (cat) {
    if (BOOKMARKS.some(c => c.id !== catId && c.title.toLowerCase() === title.toLowerCase())) return alert(`"${title}" zaten var.`);
    cat.title = title;
    cat.order = isNaN(order) ? 999 : order;
  }
  $('#modalCategoryEdit').classList.remove('active');
  await handleDataChange();
};

$('#saveCategory').onclick = async () => {
  const title = $('#cTitle').value.trim();
  if (!title) return;
  if (BOOKMARKS.some(c => c.title.toLowerCase() === title.toLowerCase())) return alert(`"${title}" zaten var.`);
  const minOrder = BOOKMARKS.length > 0 ? Math.min(...BOOKMARKS.map(c=>c.order??0)) : 0;
  BOOKMARKS.unshift({ id: 'cat_'+Date.now(), title, order: minOrder-1, items: [] });
  $('#modalCategory').classList.remove('active');
  currentView = BOOKMARKS[0].id;
  await handleDataChange();
};

$('#saveGame').onclick = async () => {
  const title = $('#gTitle').value.trim();
  const image = $('#gImage').value.trim();
  let percent = parseInt($('#gPercent').value);
  if (!title) return alert('Oyun adı zorunlu.');
  if (isNaN(percent)||percent<0) percent=0;
  if (percent>100) percent=100;
  if (editingGameId) {
    const game = GAMES.find(g => g.id===editingGameId);
    if (game) { game.title=title; game.image=image; game.percent=percent; }
  } else {
    GAMES.push({ id:'g_'+Date.now(), title, image, percent });
  }
  $('#modalGame').classList.remove('active');
  await handleDataChange();
};

$('#deleteGameBtn').onclick = async () => {
  if (!editingGameId) return;
  if (!confirm('Bu oyunu silmek istediğine emin misin?')) return;
  GAMES = GAMES.filter(g => g.id !== editingGameId);
  $('#modalGame').classList.remove('active');
  await handleDataChange();
};
$('#cancelGame').onclick = () => $('#modalGame').classList.remove('active');

$('#categories').addEventListener('click', e => {
  const catEl = e.target.closest('.category');
  if (!catEl) return;
  const catId = catEl.dataset.id;
  if (e.target.closest('.edit-cat')) { openCategoryEditModal(catId); return; }
  if (e.target.closest('.delete-cat')) {
    if (!confirm('Emin misin? Tüm bookmarklar silinecek.')) return;
    BOOKMARKS = BOOKMARKS.filter(c => c.id !== catId);
    if (currentView === catId) currentView = 'home';
    handleDataChange();
    return;
  }
  currentView = catId;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  renderApp();
});

$('#contentArea').addEventListener('click', e => {
  if (e.target.closest('#addGameBtn')) { openGameModal(); return; }
  const gameEdit = e.target.closest('.game-edit-btn');
  if (gameEdit) { e.preventDefault(); e.stopPropagation(); openGameModal(gameEdit.dataset.gameId); return; }
  const gameTab = e.target.closest('.game-tab');
  if (gameTab) { activeGameTab = gameTab.dataset.tab; renderHome(); return; }
  const editBtn = e.target.closest('.tile-edit-btn');
  if (editBtn) { e.preventDefault(); e.stopPropagation(); openModalForEdit(editBtn.dataset.bookmarkId, editBtn.dataset.categoryId); return; }
});

[$('#cancelModal'), $('#cancelCategory'), $('#cancelCategoryEdit'), $('#cancelSettings')].forEach(btn => {
  btn.onclick = () => btn.closest('.modal').classList.remove('active');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal.active').forEach(m => m.classList.remove('active'));
  }
});

// ─── RADIO ───
const stations = [
  { name: "Max FM", frequency: 95.8, url: "https://maxfm.radyotvonline.net/stream/164/" },
  { name: "Radyo ODTÜ", frequency: 103.1, url: "https://stream.radyoodtu.com.tr/canli" },
  { name: "Groove Salad", frequency: "Online", url: "https://ice5.somafm.com/groovesalad-128-mp3" },
  { name: "Space Station", frequency: "Online", url: "https://ice5.somafm.com/spacestation-128-mp3" },
  { name: "Lush", frequency: "Online", url: "https://ice5.somafm.com/lush-128-mp3" },
  { name: "Drone Zone", frequency: "Online", url: "https://ice5.somafm.com/dronezone-128-mp3" },
];
const audio = new Audio();
let curStation = 0, isPlaying = false, volume = 50;

function updateRadioScreen() {
  const s = stations[curStation];
  $('#radioScreen').innerHTML = `<div class="station-name">${s.name}</div><div class="station-freq">${typeof s.frequency==='number'?s.frequency+' MHz':s.frequency}</div>`;
}
function loadPlay() {
  audio.src = stations[curStation].url; audio.load();
  if (isPlaying) audio.play().catch(()=>{});
}
$('#prevStationBtn').onclick = () => { curStation=(curStation-1+stations.length)%stations.length; updateRadioScreen(); loadPlay(); };
$('#nextStationBtn').onclick = () => { curStation=(curStation+1)%stations.length; updateRadioScreen(); loadPlay(); };
$('#playPauseBtn').onclick = () => {
  isPlaying = !isPlaying;
  $('#playPauseBtn').textContent = isPlaying ? '⏸' : '▶';
  if (isPlaying) loadPlay(); else audio.pause();
};
$('#volumeDownBtn').onclick = () => { volume=Math.max(0,volume-10); audio.volume=volume/100; $('#volumeDisplay').textContent=volume+'%'; };
$('#volumeUpBtn').onclick = () => { volume=Math.min(100,volume+10); audio.volume=volume/100; $('#volumeDisplay').textContent=volume+'%'; };
audio.volume = volume/100;
updateRadioScreen();

// ─── WEATHER ───
const WK = 'cd6435a221fb4a71881124700252110';
const WB = 'https://api.weatherapi.com/v1';

function wIcon(code, isDay) {
  const m = {1000:isDay?'☀️':'🌙',1003:'⛅',1006:'☁️',1009:'☁️',1030:'🌫️',1063:'🌦️',1066:'🌨️',1180:'🌧️',1183:'🌧️',1186:'🌧️',1189:'🌧️',1192:'⛈️',1195:'⛈️',1210:'❄️',1213:'❄️',1216:'❄️',1219:'❄️',1222:'🌨️',1225:'🌨️',1240:'🌦️',1243:'⛈️',1246:'⛈️',1273:'⛈️',1276:'⛈️'};
  return m[code] || '☁️';
}

function wAnimation(code) {
  const el = $('#weatherAnimation');
  if (!el) return;
  el.innerHTML = '';
  if (code>=1180 && code<=1246) {
    for (let i=0;i<20;i++) { const d=document.createElement('div'); d.className='rain-drop'; d.style.left=Math.random()*100+'%'; d.style.animationDuration=(Math.random()*.5+.5)+'s'; d.style.animationDelay=(Math.random()*2)+'s'; el.appendChild(d); }
  } else if (code>=1210 && code<=1225) {
    for (let i=0;i<15;i++) { const f=document.createElement('div'); f.className='snow-flake'; f.style.left=Math.random()*100+'%'; f.style.animationDuration=(Math.random()*3+2)+'s'; f.style.animationDelay=(Math.random()*2)+'s'; el.appendChild(f); }
  }
}

function updateWeather(data) {
  if (!data) return;
  const c=data.current; const f=data.forecast.forecastday;
  if ($('#currentTemp')) $('#currentTemp').textContent=`${Math.round(c.temp_c)}°`;
  if ($('#weatherDesc')) $('#weatherDesc').textContent=c.condition.text;
  if ($('#mainIcon')) $('#mainIcon').textContent=wIcon(c.condition.code,c.is_day);
  if ($('#humidity')) $('#humidity').textContent=`${c.humidity}%`;
  if ($('#wind')) $('#wind').textContent=`${c.wind_kph.toFixed(1)} km/s`;
  if ($('#rainChance')) $('#rainChance').textContent=`${f[0].day.daily_chance_of_rain||0}%`;
  if ($('#feelsLike')) $('#feelsLike').textContent=`${Math.round(c.feelslike_c)}°`;
  wAnimation(c.condition.code);
  const allH=f.flatMap(d=>d.hour);
  const now=new Date();
  const next=allH.filter(h=>new Date(h.time_epoch*1000)>now).slice(0,12);
  if ($('#hourlyForecast')) $('#hourlyForecast').innerHTML=next.map(h=>`<div class="hour-card"><div class="hour-time">${new Date(h.time).getHours()}:00</div><div class="hour-icon">${wIcon(h.condition.code,h.is_day)}</div><div class="hour-temp">${Math.round(h.temp_c)}°</div><div class="hour-rain">💧${h.chance_of_rain}%</div></div>`).join('');
  const days=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
  if ($('#dailyForecast')) $('#dailyForecast').innerHTML=f.map((d,i)=>`<div class="day-card"><div class="day-name">${i===0?'Bugün':days[new Date(d.date).getDay()]}</div><div class="day-icon">${wIcon(d.day.condition.code,1)}</div><div class="day-temps"><span class="day-max">${Math.round(d.day.maxtemp_c)}°</span><span class="day-min">${Math.round(d.day.mintemp_c)}°</span></div><div class="day-rain">💧${d.day.daily_chance_of_rain}%</div></div>`).join('');
}

async function initWeatherWidget() {
  const data = await fetch(`${WB}/forecast.json?key=${WK}&q=${encodeURIComponent('Etimesgut, Ankara, Turkey')}&days=3&lang=tr`).then(r=>r.json()).catch(()=>null);
  if (data) updateWeather(data);
  const sel = $('#districtSelect');
  if (sel) {
    sel.addEventListener('change', async e => {
      const d=await fetch(`${WB}/forecast.json?key=${WK}&q=${encodeURIComponent(e.target.value+', Ankara, Turkey')}&days=3&lang=tr`).then(r=>r.json()).catch(()=>null);
      if (d) updateWeather(d);
    });
  }
}

$('#doImportBtn').onclick = async () => {
  try {
    const parsed = JSON.parse($('#importJson').value);
    if (!Array.isArray(parsed)) throw new Error('Geçersiz format');
    BOOKMARKS = parsed;
    await handleDataChange();
    $('#modalSettings').classList.remove('active');
    alert('Import başarılı!');
  } catch(e) { alert('Hata: ' + e.message); }
};
</script>
